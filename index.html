<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>D365 Prep — Dynamics 365 interview drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ---------- tokens ---------- */
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);

  --bg:#f5f6fb;
  --surface:#ffffff;
  --surface-2:#eef0f7;
  --elevated:#ffffff;
  --border:#dfe2ee;
  --border-strong:#c7cbdc;
  --text:#1b1e2b;
  --muted:#5a6078;
  --faint:#878daa;

  --accent:#5452e6;
  --accent-hi:#6d6bf2;
  --accent-soft:rgba(84,82,230,.10);
  --accent-line:rgba(84,82,230,.32);

  --ok:#12996b;
  --ok-soft:rgba(18,153,107,.12);
  --bad:#d64141;
  --bad-soft:rgba(214,65,65,.12);
  --warn:#b9771f;
  --warn-soft:rgba(185,119,31,.14);

  --d-basic:#128a73;
  --d-inter:#b07a16;
  --d-adv:#8a44c9;

  --shadow:0 1px 2px rgba(20,24,40,.06),0 8px 24px rgba(20,24,40,.06);
  --radius:14px;
  --radius-sm:9px;

  --font-head:"Space Grotesk",system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,monospace;

  --maxw:1180px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c0e16;
    --surface:#141826;
    --surface-2:#1b2030;
    --elevated:#1d2232;
    --border:#272d41;
    --border-strong:#353d56;
    --text:#e9ebf5;
    --muted:#9aa1bd;
    --faint:#6a7291;

    --accent:#8785f6;
    --accent-hi:#9d9bff;
    --accent-soft:rgba(135,133,246,.14);
    --accent-line:rgba(135,133,246,.34);

    --ok:#45cf93;
    --ok-soft:rgba(69,207,147,.14);
    --bad:#f0706f;
    --bad-soft:rgba(240,112,111,.14);
    --warn:#e3ad5f;
    --warn-soft:rgba(227,173,95,.16);

    --d-basic:#4cc79f;
    --d-inter:#e0a94f;
    --d-adv:#b283ef;

    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.36);
  }
}
:root[data-theme="dark"]{
  --bg:#0c0e16;
  --surface:#141826;
  --surface-2:#1b2030;
  --elevated:#1d2232;
  --border:#272d41;
  --border-strong:#353d56;
  --text:#e9ebf5;
  --muted:#9aa1bd;
  --faint:#6a7291;

  --accent:#8785f6;
  --accent-hi:#9d9bff;
  --accent-soft:rgba(135,133,246,.14);
  --accent-line:rgba(135,133,246,.34);

  --ok:#45cf93;
  --ok-soft:rgba(69,207,147,.14);
  --bad:#f0706f;
  --bad-soft:rgba(240,112,111,.14);
  --warn:#e3ad5f;
  --warn-soft:rgba(227,173,95,.16);

  --d-basic:#4cc79f;
  --d-inter:#e0a94f;
  --d-adv:#b283ef;

  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.36);
}

*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--font-body);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--accent-soft)}

/* ---------- shell ---------- */
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}

header.top{
  position:sticky;top:0;z-index:40;
  padding-top:env(safe-area-inset-top,0px);
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.top-inner{display:flex;align-items:center;gap:18px;height:62px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.mark{
  width:32px;height:32px;border-radius:9px;flex:0 0 auto;
  background:linear-gradient(145deg,var(--accent-hi),var(--accent));
  display:grid;place-items:center;color:#fff;font-family:var(--font-head);
  font-weight:700;font-size:15px;box-shadow:0 2px 10px var(--accent-line);
}
.brand h1{font-family:var(--font-head);font-weight:600;font-size:17px;margin:0;letter-spacing:-.01em}
.brand .sub{font-size:12px;color:var(--faint);margin-top:1px}
.brand .col{min-width:0}

.top-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.mastery{display:flex;align-items:center;gap:10px}
.ring{width:38px;height:38px;transform:rotate(-90deg)}
.ring .track{stroke:var(--border-strong);fill:none;stroke-width:4}
.ring .bar{stroke:var(--accent);fill:none;stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1)}
.mastery .m-num{font-family:var(--font-head);font-weight:600;font-size:15px;line-height:1}
.mastery .m-lab{font-size:11px;color:var(--faint);line-height:1.2}
.icon-btn{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface);color:var(--muted);display:grid;place-items:center;
  transition:border-color .15s,color .15s;
}
.icon-btn:hover{border-color:var(--border-strong);color:var(--text)}
.icon-btn svg{width:18px;height:18px}

/* tabs */
.tabs{display:flex;gap:4px;padding:10px 0 0}
.tab{
  border:none;background:none;color:var(--muted);font-weight:500;font-size:14px;
  padding:9px 14px;border-radius:9px 9px 0 0;position:relative;
}
.tab[aria-selected="true"]{color:var(--text)}
.tab[aria-selected="true"]::after{
  content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;
  background:var(--accent);border-radius:2px;
}
.tab .n{font-family:var(--font-mono);font-size:11px;color:var(--faint);margin-left:7px}

main{padding:22px 0 72px}

/* ---------- toolbar ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  border:1px solid var(--border);background:var(--surface);color:var(--muted);
  padding:6px 12px;border-radius:999px;font-size:13px;font-weight:500;
  transition:all .14s;
}
.chip:hover{border-color:var(--border-strong);color:var(--text)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-hi)}
.chip .c{font-family:var(--font-mono);font-size:11px;opacity:.75;margin-left:5px}
.grow{flex:1 1 auto}
.search{
  display:flex;align-items:center;gap:8px;border:1px solid var(--border);
  background:var(--surface);border-radius:10px;padding:0 11px;height:38px;min-width:190px;
}
.search:focus-within{border-color:var(--accent-line)}
.search svg{width:15px;height:15px;color:var(--faint);flex:0 0 auto}
.search input{border:none;background:none;outline:none;color:var(--text);font-size:14px;width:100%;font-family:inherit}
.btn-ghost{
  border:1px solid var(--border);background:var(--surface);color:var(--muted);
  height:38px;padding:0 13px;border-radius:10px;font-size:13px;font-weight:500;
  transition:all .14s;display:inline-flex;align-items:center;gap:7px;
}
.btn-ghost:hover{border-color:var(--bad);color:var(--bad)}

/* ---------- practice grid ---------- */
.practice{display:grid;grid-template-columns:288px 1fr;gap:24px;align-items:start}

/* question list */
.qlist{
  border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);
  overflow:hidden;position:sticky;top:132px;max-height:calc(100vh - 160px);display:flex;flex-direction:column;
}
.qlist-head{padding:13px 15px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:baseline}
.qlist-head .t{font-family:var(--font-head);font-weight:600;font-size:14px}
.qlist-head .c{font-size:12px;color:var(--faint);font-family:var(--font-mono)}
.qlist-scroll{overflow-y:auto;padding:6px}
.qrow{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  border:none;background:none;color:var(--text);padding:10px 10px;border-radius:9px;
  transition:background .12s;
}
.qrow:hover{background:var(--surface-2)}
.qrow[aria-current="true"]{background:var(--accent-soft)}
.qrow[aria-current="true"] .qr-title{color:var(--accent-hi)}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;margin-top:6px;border:1.5px solid var(--border-strong);background:transparent}
.dot.ok{background:var(--ok);border-color:var(--ok)}
.dot.bad{background:var(--bad);border-color:var(--bad)}
.qr-body{min-width:0;flex:1}
.qr-title{font-size:13px;font-weight:500;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qr-meta{display:flex;gap:6px;align-items:center;margin-top:4px}
.qr-meta .tp{font-size:11px;color:var(--faint)}
.bk{margin-left:auto;color:var(--faint);flex:0 0 auto;background:none;border:none;padding:2px;border-radius:5px}
.bk svg{width:14px;height:14px}
.bk.on{color:var(--warn)}

/* question panel */
.panel{
  border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;
}
.p-head{padding:18px 22px 0;display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.badge{font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:7px;font-family:var(--font-mono);letter-spacing:.01em}
.badge.topic{background:var(--accent-soft);color:var(--accent-hi)}
.badge.type{background:var(--surface-2);color:var(--muted)}
.badge.basic{background:color-mix(in srgb,var(--d-basic) 15%,transparent);color:var(--d-basic)}
.badge.intermediate{background:color-mix(in srgb,var(--d-inter) 15%,transparent);color:var(--d-inter)}
.badge.advanced{background:color-mix(in srgb,var(--d-adv) 16%,transparent);color:var(--d-adv)}
.badge.new{background:var(--warn-soft);color:var(--warn)}
.p-head .sp{flex:1}
.p-num{font-family:var(--font-mono);font-size:12px;color:var(--faint)}

.q-text{padding:16px 22px 4px;font-size:18px;line-height:1.5;font-family:var(--font-head);font-weight:500;letter-spacing:-.01em}
.q-sub{padding:0 22px;color:var(--muted);font-size:14px}

.options{padding:14px 22px 4px;display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;gap:13px;align-items:flex-start;text-align:left;width:100%;
  border:1px solid var(--border);background:var(--surface);color:var(--text);
  padding:13px 15px;border-radius:var(--radius-sm);transition:border-color .14s,background .14s;
}
.opt:hover:not(:disabled){border-color:var(--border-strong)}
.opt:disabled{cursor:default}
.opt .key{
  width:24px;height:24px;border-radius:6px;flex:0 0 auto;display:grid;place-items:center;
  border:1px solid var(--border-strong);font-family:var(--font-mono);font-size:12.5px;font-weight:500;
  color:var(--muted);transition:all .14s;
}
.opt .ot{font-size:14.5px;line-height:1.45;padding-top:1px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .key{background:var(--accent);border-color:var(--accent);color:#fff}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .key{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);border-color:var(--bad);color:#fff}
.opt .res{margin-left:auto;flex:0 0 auto}
.opt .res svg{width:18px;height:18px}

.p-actions{padding:16px 22px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{
  border:none;border-radius:10px;font-weight:600;font-size:14px;padding:11px 20px;
  background:var(--accent);color:#fff;transition:filter .14s,opacity .14s;
  box-shadow:0 2px 10px var(--accent-line);
}
.btn:hover:not(:disabled){filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.sec{background:var(--surface-2);color:var(--text);box-shadow:none}
.btn.sec:hover:not(:disabled){background:var(--border)}
.nav-mini{margin-left:auto;display:flex;gap:8px}
.nav-mini button{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface);
  color:var(--muted);display:grid;place-items:center;transition:all .14s;
}
.nav-mini button:hover:not(:disabled){border-color:var(--border-strong);color:var(--text)}
.nav-mini button:disabled{opacity:.4;cursor:not-allowed}
.nav-mini svg{width:17px;height:17px}

/* feedback + solution */
.feedback{
  margin:0 22px;padding:12px 15px;border-radius:var(--radius-sm);font-size:14px;font-weight:500;
  display:none;align-items:center;gap:9px;
}
.feedback.show{display:flex}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.feedback svg{width:17px;height:17px;flex:0 0 auto}

.solution{
  margin:14px 22px 22px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface-2);overflow:hidden;display:none;
}
.solution.show{display:block;animation:reveal .35s ease}
@keyframes reveal{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.sol-head{
  padding:13px 17px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;
}
.sol-head .tag{font-family:var(--font-mono);font-size:10.5px;color:var(--accent-hi);background:var(--accent-soft);padding:3px 7px;border-radius:5px;font-weight:600}
.sol-head .h{font-family:var(--font-head);font-weight:600;font-size:15px;flex:1;min-width:0}
.copy-btn{border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:12px;padding:5px 10px;border-radius:7px;display:inline-flex;gap:6px;align-items:center;transition:all .14s}
.copy-btn:hover{border-color:var(--border-strong);color:var(--text)}
.copy-btn svg{width:13px;height:13px}
.sol-body{padding:6px 18px 16px}

/* prose */
.prose{color:var(--text);font-size:14.5px}
.prose p{margin:12px 0}
.prose strong{font-weight:600}
.prose ul{margin:11px 0;padding-left:20px}
.prose li{margin:6px 0}
.prose h4{font-family:var(--font-head);font-size:14.5px;font-weight:600;margin:18px 0 8px}
.prose code{font-family:var(--font-mono);font-size:12.5px;background:var(--accent-soft);color:var(--accent-hi);padding:1.5px 5px;border-radius:5px}
.prose pre{
  font-family:var(--font-mono);font-size:12.5px;line-height:1.55;background:var(--surface);
  border:1px solid var(--border);border-radius:9px;padding:13px 15px;overflow-x:auto;margin:12px 0;color:var(--text);
}
.prose pre code{background:none;color:inherit;padding:0}
.prose table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13.5px;display:block;overflow-x:auto}
.prose th,.prose td{border:1px solid var(--border);padding:8px 11px;text-align:left;vertical-align:top}
.prose th{background:var(--surface);font-weight:600;font-family:var(--font-head);white-space:nowrap}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 8px 8px 0;margin:14px 0}
.callout.key{border-color:var(--warn);background:var(--warn-soft)}

/* notes */
.notes-intro{max-width:720px;margin-bottom:22px}
.notes-intro h2{font-family:var(--font-head);font-weight:600;font-size:22px;margin:0 0 6px;letter-spacing:-.015em}
.notes-intro p{color:var(--muted);margin:0}
.note{
  border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);
  margin-bottom:12px;overflow:hidden;
}
.note-head{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;border:none;
  background:none;color:var(--text);padding:16px 20px;
}
.note-head::-webkit-details-marker{display:none}
.note-head:hover{background:var(--surface-2)}
.note-ix{font-family:var(--font-mono);font-size:12px;color:var(--faint);width:22px;flex:0 0 auto}
.note-head .nt{font-family:var(--font-head);font-weight:600;font-size:16px;flex:1;letter-spacing:-.01em}
.note-head .tp{font-size:12px;color:var(--faint);margin-right:4px}
.note-head .caret{transition:transform .2s;color:var(--muted)}
.note-head .caret svg{width:18px;height:18px}
.note[open] .caret{transform:rotate(180deg)}
.note-body{padding:2px 20px 20px;border-top:1px solid var(--border)}

/* empty */
.empty{border:1px dashed var(--border-strong);border-radius:var(--radius);padding:48px 24px;text-align:center;color:var(--muted)}
.empty .big{font-family:var(--font-head);font-weight:600;font-size:17px;color:var(--text);margin-bottom:6px}

.hidden{display:none!important}
.list-toggle{display:none}

.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--text);color:var(--bg);font-size:13px;font-weight:500;padding:9px 16px;border-radius:9px;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- responsive ---------- */
@media (max-width:860px){
  .practice{grid-template-columns:1fr}
  .qlist{position:fixed;inset:0;top:0;z-index:60;max-height:100vh;border-radius:0;
    padding-top:env(safe-area-inset-top,0px);transform:translateX(-100%);transition:transform .25s}
  .qlist.open{transform:none}
  .qlist-head .close{display:grid}
  .list-toggle{display:inline-flex;align-items:center;gap:7px}
  .brand .sub{display:none}
  .q-text{font-size:16.5px}
}
.qlist-head .close{display:none;width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--muted);place-items:center}
.qlist-head .close svg{width:16px;height:16px}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap top-inner">
    <div class="brand">
      <div class="mark">D</div>
      <div class="col">
        <h1>D365 Prep</h1>
        <div class="sub" id="brandSub">Dynamics 365 interview drill</div>
      </div>
    </div>
    <div class="top-right">
      <div class="mastery" title="Share of questions answered correctly">
        <svg class="ring" viewBox="0 0 38 38">
          <circle class="track" cx="19" cy="19" r="16"></circle>
          <circle class="bar" id="ringBar" cx="19" cy="19" r="16" stroke-dasharray="100.5" stroke-dashoffset="100.5"></circle>
        </svg>
        <div>
          <div class="m-num" id="masteryNum">0%</div>
          <div class="m-lab">mastery</div>
        </div>
      </div>
      <button class="icon-btn" id="themeBtn" title="Switch light / dark" aria-label="Switch theme"></button>
    </div>
  </div>
  <div class="wrap">
    <div class="tabs" role="tablist">
      <button class="tab" id="tabPractice" role="tab" aria-selected="true">Practice<span class="n" id="practiceCount"></span></button>
      <button class="tab" id="tabNotes" role="tab" aria-selected="false">Notes<span class="n" id="notesCount"></span></button>
    </div>
  </div>
</header>

<main class="wrap">

  <!-- PRACTICE -->
  <section id="viewPractice">
    <div class="toolbar">
      <div class="chips" id="topicChips"></div>
      <div class="grow"></div>
      <div class="chips" id="statusChips"></div>
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="searchInput" type="search" placeholder="Search questions…" autocomplete="off">
      </label>
      <button class="list-toggle btn-ghost" id="listToggle" style="border-color:var(--border);color:var(--muted)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        All
      </button>
      <button class="btn-ghost" id="resetBtn" title="Clear all saved progress">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        Reset
      </button>
    </div>

    <div class="practice">
      <aside class="qlist" id="qlist">
        <div class="qlist-head">

<li><strong>Unique Alternate Key</strong> (always, as a safety net): the DB physically rejects a duplicate; pair with a retry so the loser just regenerates.</li>

  {
    id:"n-txn", title:"Transactions & Rollback", topic:"Foundations",
    body:`
<p>A <strong>transaction</strong> is a group of operations that must all succeed or all fail together — no half-done state.</p>
<div class="callout"><strong>ATM analogy:</strong> deduct ₹1000, then dispense ₹1000. If the dispense fails, the deduction is rolled back — your balance is restored as if nothing happened.</div>
<p>When you save a record, Dataverse wraps it in a transaction. If a <strong>synchronous</strong> plugin throws, the whole save rolls back and the record is never created — that's why sync plugins can "block" a save.</p>
<h4>Which stages sit inside the transaction</h4>
<table>
<tr><th>Stage</th><th>In transaction?</th><th>Meaning</th></tr>
<tr><td>Pre-Validation</td><td>No (outside)</td><td>Before the transaction starts — cheapest place to reject bad input.</td></tr>
<tr><td>Pre-Operation</td><td>Yes</td><td>Inside txn, before the DB write.</td></tr>
<tr><td>Main Operation</td><td>Yes</td><td>The platform's actual write.</td></tr>
<tr><td>Post-Operation</td><td>Yes</td><td>Inside txn, after the write, before commit.</td></tr>
</table>`
  },

    body:`
<p><strong>Parallel</strong> = multiple things happening at once, independently. If four users create Accounts simultaneously, the Create plugin runs four times in parallel — each unaware of the others.</p>
<p>A <strong>race condition</strong> is when two parallel operations act on the same starting data before either finishes, producing a wrong result.</p>
<div class="callout"><strong>Last-seat analogy:</strong> two people book the last movie seat at the same instant. Both see "available", both click book, the seat sells twice.</div>
<pre><code>T1  A: read MAX -> 1002
T2  B: read MAX -> 1002
T3  A: write 1003
T4  B: write 1003   // duplicate</code></pre>
<h4>Fixes</h4>
<ul>
<li>Native <strong>Autonumber</strong> column (platform guarantees uniqueness)</li>
<li>Counter row + <code>RowVersion</code> optimistic concurrency + retry</li>
<li>Unique <strong>Alternate Key</strong> as a DB-level safety net</li>
</ul>`

  {
    id:"n-syncasync", title:"Sync vs Async Plugins", topic:"Plugins",
    body:`
<h4>Synchronous</h4>
<p>Runs immediately as part of the user's save. The user <strong>waits</strong>; runs inside the transaction (Pre/Post-Op); if it throws, the save rolls back.</p>
<p>Use for: validating/blocking a save, editing the same record before save (Pre-Op), fast logic that must be guaranteed with the save.</p>
<h4>Asynchronous</h4>
<p>Runs later in a background queue, in its <strong>own</strong> transaction, after the main one committed. The user <strong>doesn't wait</strong>; if it throws, only the background job fails.</p>
<p>Use for: external/3rd-party calls, heavy processing, anything that needn't block the save.</p>
<table>
<tr><th>Aspect</th><th>Sync</th><th>Async</th></tr>
<tr><td>User waits?</td><td>Yes</td><td>No</td></tr>
<tr><td>Transaction</td><td>Shares user's txn</td><td>Own txn, after commit</td></tr>
<tr><td>Can block/cancel save?</td><td>Yes (throw)</td><td>No (already saved)</td></tr>
<tr><td>Failure impact</td><td>Rolls back the save</td><td>Only the job fails</td></tr>
<tr><td>Good for</td><td>Validation, same-record edits</td><td>External calls, heavy work</td></tr>
</table>
<div class="callout key"><strong>Key:</strong> "In transaction" ≠ "runs one at a time." Transaction scope controls rollback, not concurrency. Both modes run in parallel.</div>`

<p>A <strong>System Job</strong> is Dataverse's record of a background task. <code>AsyncOperation</code> is the underlying table — same thing, two names. It's the platform's central queue for all deferred work.</p>
<h4>What creates one</h4>
<ul>
<li>Async plugins</li>
<li>Dataverse-triggered Power Automate flows</li>
<li>Classic background workflows</li>
<li>Bulk operations (bulk delete/import)</li>
<li>System maintenance (reindexing, cleanup)</li>
</ul>
<h4>Key columns</h4>
<table>
<tr><th>Column</th><th>Meaning</th></tr>
<tr><td>StatusCode</td><td>Waiting / In Progress / Succeeded / Failed / Canceled</td></tr>
<tr><td>Regarding</td><td>Which record it ran for</td></tr>
<tr><td>Message</td><td>Error + stack trace if failed</td></tr>
<tr><td>RetryCount</td><td>How many times it's been attempted</td></tr>
<tr><td>PostponeUntil</td><td>When a deferred retry will run</td></tr>
</table>
<p>Find them in the Power Platform Admin Center → Environment → <strong>System Jobs</strong>, or query the <code>asyncoperation</code> entity. Succeeded jobs are auto-cleaned; failed jobs are retained for investigation.</p>`
  },
  {
    id:"n-retry", title:"Async Retry & Idempotency", topic:"Plugins",
    body:`
<p>Dataverse's async retry is platform-controlled and not fully configurable. It distinguishes two failure types:</p>
<table>
<tr><th>Type</th><th>Example</th><th>Retried?</th></tr>
<tr><td>Transient</td><td>SQL timeout, deadlock, throttling, server busy</td><td>Yes, auto, with backoff</td></tr>
<tr><td>Non-transient</td><td>NullReference, bad data, business throw, auth rejected</td><td>No — stays Failed</td></tr>
</table>
<p>Retries use an increasing <strong>backoff</strong>, increment <code>RetryCount</code>, and stop after a platform limit.</p>
<div class="callout key"><strong>The gotcha:</strong> a retry re-runs the operation from the start. If it had external side-effects, you can get duplicates.</div>
<h4>Idempotency</h4>
<p>Design every async op with external side-effects so running it twice equals running it once:</p>
<ul>
<li>Check-before-create</li>
<li>Unique key / idempotency token the external system dedupes on</li>
<li>Progress flags on the record so a retry resumes rather than repeats</li>
</ul>
<p>For permanently-failed jobs you've since fixed: Resume the System Job manually, or re-queue via a scheduled flow.</p>`
  },
  {
    id:"n-images", title:"Plugin Images (Pre / Post)", topic:"Plugins",
    body:`
<p>An <strong>image</strong> is a snapshot of the record attached to the execution context, so you can read field values without an extra Retrieve.</p>
<table>
<tr><th>Image</th><th>Snapshot</th><th>Available on</th></tr>
<tr><td>Pre-Image</td><td>Before the operation</td><td>Update, Delete</td></tr>
<tr><td>Post-Image</td><td>After the operation</td><td>Create, Update</td></tr>
</table>
<p>Register images on the step and list only the attributes you need. Read them via <code>context.PreEntityImages["name"]</code> / <code>context.PostEntityImages["name"]</code>.</p>
<div class="callout key"><strong>Why they matter:</strong> on Update the <strong>Target</strong> holds only the fields that changed. To see an old value or an unchanged field, use a Pre-Image — it's cheaper than a Retrieve round-trip.</div>`
  },
  {
    id:"n-order-loop", title:"Execution Order, Depth & Recursion", topic:"Plugins",
    body:`
<h4>Execution order (rank)</h4>
<p>Steps on the same message + stage run in ascending <strong>Execution Order</strong>. Lower rank first; within the same rank, order is undefined. If one step depends on another's output, set the ranks explicitly — don't rely on registration time.</p>
<h4>Depth</h4>
<p><code>context.Depth</code> = how deep in the pipeline you are. <strong>1</strong> for the original action, higher when one plugin's operation triggers another.</p>
<h4>Recursion / infinite loops</h4>
<p>A plugin that updates the record it fires on re-triggers itself. The platform caps depth (default 8) and throws to break the loop.</p>
<ul>
<li><strong>Best:</strong> to change the same record, edit the <strong>Target in Pre-Operation</strong> — no second update, no loop.</li>
<li>Use <strong>filtering attributes</strong> so the step only fires on relevant field changes.</li>
<li><code>Depth &gt; 1</code> guard as a last resort — it treats the symptom.</li>
</ul>`
  },
  {
    id:"n-context", title:"Plugin Context Essentials", topic:"Plugins",
    body:`
<h4>Getting the data</h4>
<ul>
<li><code>context.InputParameters["Target"]</code> — the record being operated on. Entity on Create/Update, EntityReference on Delete.</li>
<li><code>context.OutputParameters["id"]</code> — the new GUID on Create (Post-Op).</li>
<li><code>context.SharedVariables</code> — pass values between steps in the pipeline (Pre-Op → Post-Op); <code>ParentContext.SharedVariables</code> for a parent pipeline's values.</li>
</ul>
<h4>The service</h4>
<ul>
<li><code>CreateOrganizationService(context.UserId)</code> — runs as the calling user, respects their privileges.</li>
<li><code>CreateOrganizationService(null)</code> — runs as SYSTEM, bypasses security. Use sparingly.</li>
<li><code>UserId</code> vs <code>InitiatingUserId</code> — who the plugin runs as vs who actually triggered it.</li>
</ul>
<h4>Config & hosting</h4>
<ul>
<li>Secrets (API keys) → <strong>Secure</strong> configuration, not Unsecure. Environment variables are the modern alternative.</li>
<li><strong>Stateless only:</strong> the plugin instance is cached and reused across threads — keep request state in locals, never in fields.</li>
<li><strong>Sandbox isolation</strong> (required online): no file system/registry, outbound only on 443/80.</li>
</ul>`
  }
];

/* ============================================================
   STATE + STORAGE
   ============================================================ */
const SKEY="d365prep:v1";
let store={progress:{},theme:null};
try{const raw=localStorage.getItem(SKEY);if(raw)store=Object.assign(store,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(SKEY,JSON.stringify(store));}catch(e){}}
function prog(id){return store.progress[id]||(store.progress[id]={answered:false,correct:null,picked:null,bookmarked:false});}

const filters={topic:"All",status:"All",search:""};
let currentId=QUESTIONS[0].id;

const $=s=>document.querySelector(s);
const el=(t,c)=>{const n=document.createElement(t);if(c)n.className=c;return n;};

/* ============================================================
   THEME
   ============================================================ */
const sun=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>`;
const moon=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.5A8.5 8.5 0 1 1 11.5 3a6.5 6.5 0 0 0 9.5 9.5Z"/></svg>`;
function sysDark(){return window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches;}
function effDark(){return store.theme?store.theme==="dark":sysDark();}
function applyTheme(){
  if(store.theme)document.documentElement.setAttribute("data-theme",store.theme);
  else document.documentElement.removeAttribute("data-theme");
  $("#themeBtn").innerHTML=effDark()?sun:moon;
}
$("#themeBtn").addEventListener("click",()=>{store.theme=effDark()?"light":"dark";save();applyTheme();});
applyTheme();

/* ============================================================
   RENDER — practice list + panel
   ============================================================ */
function filtered(){
  return QUESTIONS.filter(q=>{
    if(filters.topic!=="All"&&q.topic!==filters.topic)return false;
    const p=prog(q.id);
    if(filters.status==="Unanswered"&&p.answered)return false;
    if(filters.status==="Incorrect"&&p.correct!==false)return false;
    if(filters.status==="Bookmarked"&&!p.bookmarked)return false;
    if(filters.status==="New"&&q.date!==BANK_DATE)return false;
    if(filters.search){
      const s=filters.search.toLowerCase();
      if(!(q.q.toLowerCase().includes(s)||q.topic.toLowerCase().includes(s)||q.header.toLowerCase().includes(s)))return false;
    }
    return true;
  });
}

function topicCounts(){
  const m={};QUESTIONS.forEach(q=>m[q.topic]=(m[q.topic]||0)+1);return m;
}

function renderTopicChips(){
  const host=$("#topicChips");host.innerHTML="";
  const counts=topicCounts();
  const topics=["All",...Object.keys(counts)];
  topics.forEach(t=>{
    const c=el("button","chip");
    c.setAttribute("aria-pressed",filters.topic===t);
    c.innerHTML=t+`<span class="c">${t==="All"?QUESTIONS.length:counts[t]}</span>`;
    c.onclick=()=>{filters.topic=t;renderAll();};
    host.appendChild(c);
  });
}
function renderStatusChips(){
  const host=$("#statusChips");host.innerHTML="";
  const defs=[["All"],["New"],["Unanswered"],["Incorrect"],["Bookmarked"]];
  defs.forEach(([t])=>{
    const c=el("button","chip");
    c.setAttribute("aria-pressed",filters.status===t);
    c.textContent=t;
    c.onclick=()=>{filters.status=t;renderAll();};
    host.appendChild(c);
  });
}

function bkIcon(on){
  return `<svg viewBox="0 0 24 24" fill="${on?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1Z"/></svg>`;
}

function renderList(){
  const list=filtered();
  const scroll=$("#qlistScroll");scroll.innerHTML="";
  $("#qlistCount").textContent=list.length+" shown";
  if(!list.length){
    const e=el("div");e.style.padding="24px 14px";e.style.color="var(--faint)";e.style.fontSize="13px";
    e.textContent="No questions match these filters.";scroll.appendChild(e);return;
  }
  list.forEach(q=>{
    const p=prog(q.id);
    const row=el("button","qrow");
    row.setAttribute("aria-current",q.id===currentId);
    const dotCls=p.answered?(p.correct?"dot ok":"dot bad"):"dot";
    row.innerHTML=`
      <span class="${dotCls}"></span>
      <span class="qr-body">
        <span class="qr-title">${q.q}</span>
        <span class="qr-meta"><span class="tp">${q.topic} · ${q.difficulty}</span></span>
      </span>`;
    const bk=el("button","bk"+(p.bookmarked?" on":""));
    bk.innerHTML=bkIcon(p.bookmarked);bk.title="Bookmark";
    bk.onclick=(ev)=>{ev.stopPropagation();p.bookmarked=!p.bookmarked;save();renderAll();};
    row.appendChild(bk);
    row.onclick=()=>{currentId=q.id;closeList();renderAll();window.scrollTo({top:0,behavior:"smooth"});};
    scroll.appendChild(row);
  });
}

function renderPanel(){
  const host=$("#panelHost");host.innerHTML="";
  const list=filtered();
  if(!list.includes(QUESTIONS.find(q=>q.id===currentId))){
    if(list.length)currentId=list[0].id;
  }
  const q=QUESTIONS.find(x=>x.id===currentId);
  if(!q){
    const e=el("div","empty");
    e.innerHTML=`<div class="big">Nothing to practice here</div><div>Clear a filter to see questions again.</div>`;
    host.appendChild(e);return;
  }
  const p=prog(q.id);
  const idx=list.indexOf(q);
  const panel=el("div","panel");

  const dcl=q.difficulty.toLowerCase();
  const isNew=q.date===BANK_DATE;
  panel.innerHTML=`
    <div class="p-head">
      <span class="badge topic">${q.topic}</span>
      <span class="badge type">${q.type}</span>
      <span class="badge ${dcl}">${q.difficulty}</span>
      ${isNew?'<span class="badge new">New</span>':''}
      <span class="sp"></span>
      <span class="p-num">${idx+1} / ${list.length}</span>
    </div>
    <div class="q-text">${q.q}</div>`;

  // OPTIONS or scenario reveal
  if(q.options){
    const opts=el("div","options");
    q.options.forEach((text,i)=>{
      const o=el("button","opt");
      const key=String.fromCharCode(65+i);
      o.innerHTML=`<span class="key">${key}</span><span class="ot">${text}</span><span class="res"></span>`;
      if(p.answered){
        o.disabled=true;
        if(i===q.correct)o.classList.add("correct");
        if(i===p.picked&&!p.correct)o.classList.add("wrong");
        if(i===q.correct)o.querySelector(".res").innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="var(--ok)" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg>`;
        else if(i===p.picked)o.querySelector(".res").innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="var(--bad)" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>`;
      }else{
        if(i===p.picked)o.classList.add("sel");
        o.onclick=()=>{p.picked=i;save();renderPanel();};
      }
      opts.appendChild(o);
    });
    panel.appendChild(opts);
  }

  // feedback
  const fb=el("div","feedback");
  if(p.answered&&q.options){
    fb.classList.add("show",p.correct?"ok":"bad");
    fb.innerHTML=p.correct
      ?`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg> Correct.`
      :`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg> Not quite — review the solution below.`;
  }
  panel.appendChild(fb);

  // actions
  const act=el("div","p-actions");
  if(q.options){
    const submit=el("button","btn");
    submit.textContent=p.answered?"Answered":"Check answer";
    submit.disabled=p.answered||p.picked==null;
    submit.onclick=()=>{p.answered=true;p.correct=(p.picked===q.correct);save();renderAll();};
    act.appendChild(submit);
    if(p.answered){
      const retry=el("button","btn sec");retry.textContent="Try again";
      retry.onclick=()=>{p.answered=false;p.correct=null;p.picked=null;save();renderAll();};
      act.appendChild(retry);
    }
  }else{
    const reveal=el("button","btn");
    reveal.textContent=p.answered?"Solution shown":"Reveal solution";
    reveal.disabled=p.answered;
    reveal.onclick=()=>{p.answered=true;p.correct=true;save();renderAll();};
    act.appendChild(reveal);
    if(p.answered){
      const hide=el("button","btn sec");hide.textContent="Hide";
      hide.onclick=()=>{p.answered=false;p.correct=null;save();renderAll();};
      act.appendChild(hide);
    }
  }
  const nav=el("div","nav-mini");
  const prev=el("button");prev.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>`;
  prev.disabled=idx<=0;prev.title="Previous";
  prev.onclick=()=>{currentId=list[idx-1].id;renderAll();window.scrollTo({top:0,behavior:"smooth"});};
  const next=el("button");next.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>`;
  next.disabled=idx>=list.length-1;next.title="Next";
  next.onclick=()=>{currentId=list[idx+1].id;renderAll();window.scrollTo({top:0,behavior:"smooth"});};
  nav.appendChild(prev);nav.appendChild(next);
  act.appendChild(nav);
  panel.appendChild(act);

  // solution
  const sol=el("div","solution"+(p.answered?" show":""));
  sol.innerHTML=`
    <div class="sol-head">
      <span class="tag">NOTION</span>
      <span class="h">${q.header}</span>
      <button class="copy-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>Copy</button>
    </div>
    <div class="sol-body"><div class="prose">${q.solution}</div></div>`;
  sol.querySelector(".copy-btn").onclick=()=>copyNote(q);
  panel.appendChild(sol);

  host.appendChild(panel);
}

/* markdown-ish plain text for copy (Notion-friendly) */
function copyNote(q){
  const tmp=el("div");tmp.innerHTML=q.solution;
  let out=`## ${q.header}\n\n`;
  out+=htmlToText(tmp).trim()+"\n";
  navigator.clipboard?.writeText(out).then(()=>toast("Copied — paste into Notion")).catch(()=>toast("Copy failed"));
}
function htmlToText(node){
  let s="";
  node.childNodes.forEach(n=>{
    if(n.nodeType===3){s+=n.textContent;return;}
    const tag=n.tagName?.toLowerCase();
    if(tag==="li")s+="\n- "+htmlToText(n).trim();
    else if(tag==="h4")s+="\n\n### "+htmlToText(n).trim()+"\n";
    else if(tag==="p")s+="\n"+htmlToText(n).trim()+"\n";
    else if(tag==="pre")s+="\n```\n"+n.textContent.trim()+"\n```\n";
    else if(tag==="ul")s+=htmlToText(n)+"\n";
    else if(tag==="table")s+="\n"+tableToText(n)+"\n";
    else if(tag==="div"&&n.className.includes("callout"))s+="\n> "+htmlToText(n).trim()+"\n";
    else s+=htmlToText(n);
  });
  return s;
}
function tableToText(t){
  const rows=[...t.querySelectorAll("tr")];
  return rows.map(r=>[...r.children].map(c=>c.textContent.trim()).join(" | ")).join("\n");
}

/* ============================================================
   MASTERY + counts
   ============================================================ */
function renderMastery(){
  const total=QUESTIONS.length;
  let correct=0;QUESTIONS.forEach(q=>{if(prog(q.id).correct===true)correct++;});
  const pct=total?Math.round(correct/total*100):0;
  $("#masteryNum").textContent=pct+"%";
  const circ=2*Math.PI*16;
  $("#ringBar").setAttribute("stroke-dasharray",circ.toFixed(1));
  $("#ringBar").setAttribute("stroke-dashoffset",(circ*(1-pct/100)).toFixed(1));
  $("#practiceCount").textContent=total;
  $("#notesCount").textContent=NOTES.length;
  $("#brandSub").textContent="Updated "+fmtDate(BANK_DATE)+" · "+total+" questions";
}
function fmtDate(iso){
  const d=new Date(iso+"T00:00:00");
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
}

/* ============================================================
   NOTES
   ============================================================ */
function renderNotes(){
  const host=$("#notesHost");host.innerHTML="";
  NOTES.forEach((n,i)=>{
    const d=el("details","note");d.id="note-"+n.id;
    d.innerHTML=`
      <summary class="note-head" style="list-style:none">
        <span class="note-ix">${String(i+1).padStart(2,"0")}</span>
        <span class="nt">${n.title}</span>
        <span class="tp">${n.topic}</span>
        <span class="caret"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></span>
      </summary>
      <div class="note-body"><div class="prose">${n.body}</div></div>`;
    host.appendChild(d);
  });
}

/* ============================================================
   TABS + list drawer + reset + toast
   ============================================================ */
function showTab(which){
  const prac=which==="practice";
  $("#tabPractice").setAttribute("aria-selected",prac);
  $("#tabNotes").setAttribute("aria-selected",!prac);
  $("#viewPractice").classList.toggle("hidden",!prac);
  $("#viewNotes").classList.toggle("hidden",prac);
}
$("#tabPractice").onclick=()=>showTab("practice");
$("#tabNotes").onclick=()=>showTab("notes");

function openList(){$("#qlist").classList.add("open");}
function closeList(){$("#qlist").classList.remove("open");}
$("#listToggle").onclick=openList;
$("#qlistClose").onclick=closeList;

$("#searchInput").addEventListener("input",e=>{filters.search=e.target.value;renderList();renderPanel();});

$("#resetBtn").onclick=()=>{
  if(confirm("Clear all saved progress on this device? Your answers, scores and bookmarks will be reset."))
  {store.progress={};save();renderAll();toast("Progress cleared");}
};

let toastT;
function toast(msg){
  const t=$("#toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),1900);
}

/* keyboard: arrows to navigate, 1-4 to pick */
document.addEventListener("keydown",e=>{
  if($("#viewPractice").classList.contains("hidden"))return;
  if(/input|textarea/i.test(document.activeElement.tagName))return;
  const list=filtered();const q=QUESTIONS.find(x=>x.id===currentId);if(!q)return;
  const idx=list.indexOf(q);
  if(e.key==="ArrowRight"&&idx<list.length-1){currentId=list[idx+1].id;renderAll();}
  else if(e.key==="ArrowLeft"&&idx>0){currentId=list[idx-1].id;renderAll();}
  else if(q.options&&!prog(q.id).answered&&/^[1-4]$/.test(e.key)){
    const i=+e.key-1;if(i<q.options.length){prog(q.id).picked=i;save();renderPanel();}
  }
});

/* ============================================================
   BOOT
   ============================================================ */
function renderAll(){renderTopicChips();renderStatusChips();renderList();renderPanel();renderMastery();}
renderNotes();
renderAll();
</script>
